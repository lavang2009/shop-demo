<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nạp tiền tự động — SePay</title><style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f6f7fb;color:#111827}.wrap{max-width:980px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#6b7280}.balance{font-size:36px;font-weight:800;margin:8px 0 20px}.row{display:flex;gap:10px}.input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;box-sizing:border-box}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}.btn.secondary{background:#eef2ff;color:#3730a3}.status{margin-top:14px;padding:12px;border-radius:12px;background:#f3f4f6}.qr{width:100%;max-width:360px;display:block;margin:12px auto}.code{font-family:ui-monospace,monospace;background:#f3f4f6;padding:8px 10px;border-radius:8px;display:inline-block}.ok{background:#ecfdf5;color:#065f46}.warn{background:#fffbeb;color:#92400e}.small{font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><h1>💳 Nạp tiền tự động</h1><p class="muted">Mẫu tích hợp SePay + Node.js + Firebase/JSON</p><div class="grid"><section><h3>Tài khoản demo</h3><div id="user">demo-user</div><div class="balance" id="balance">0đ</div><div class="row"><input id="amount" class="input" type="number" min="10000" value="100000"><button class="btn" onclick="createDeposit()">Tạo QR</button></div><div id="status" class="status">Chưa có đơn nạp.</div></section><section id="paybox" style="display:none"><h3>Thanh toán</h3><div style="text-align:center"><img id="qr" class="qr" alt="QR thanh toán"></div><div class="small">Số tiền</div><strong id="payamount"></strong><p>Nội dung chuyển khoản:</p><span id="paycode" class="code"></span><div class="status warn" id="pending">⏳ Đang chờ giao dịch...</div><button class="btn secondary" onclick="simulate()">Test webhook (chỉ local)</button></section></div></div></div><script>
let userId='demo-user', depositId=null;
const fmt=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n);
async function refresh(){const r=await fetch('/api/balance/'+userId);const x=await r.json();document.querySelector('#balance').textContent=fmt(x.balance||0)}
async function createDeposit(){const amount=Number(document.querySelector('#amount').value);const r=await fetch('/api/deposits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,amount})});const x=await r.json();if(!r.ok){alert(x.message||'Lỗi');return}depositId=x.id;document.querySelector('#paybox').style.display='block';document.querySelector('#qr').src=x.qrDataUrl||x.qrUrl;document.querySelector('#payamount').textContent=fmt(x.amount);document.querySelector('#paycode').textContent=x.paymentCode;document.querySelector('#status').textContent='Đã tạo đơn '+x.paymentCode;poll();}
async function poll(){if(!depositId)return;const r=await fetch('/api/deposits/'+depositId);const x=await r.json();if(x.status==='paid'){document.querySelector('#pending').className='status ok';document.querySelector('#pending').textContent='✅ Nạp tiền thành công';refresh()}else setTimeout(poll,3000)}
async function simulate(){const r=await fetch('/api/test/sepay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({depositId})});const x=await r.json();if(!r.ok){alert(x.message||'Lỗi test');return}poll();refresh()}
fetch('/api/demo/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId})}).then(refresh);
</script></body></html>
